<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Under Construction - Bridgeline</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @keyframes slideIn {
            0% { transform: translateY(50px); opacity: 0; }
            100% { transform: translateY(0); opacity: 1; }
        }
        @keyframes progressBar {
            0% { width: 0; }
            100% { width: 100%; }
        }
        @keyframes gearSpin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body style="margin: 0; padding: 0; font-family: 'Poppins', sans-serif; line-height: 1.6; color: #333; background: linear-gradient(135deg, #D8F3DC 0%, #B7E4C7 100%); min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center;">
    <div style="text-align: center; padding: 2rem; max-width: 800px; background-color: rgba(255, 255, 255, 0.95); border-radius: 15px; box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1); margin: 1rem; animation: slideIn 1s ease-out;">
        <div style="position: relative; margin-bottom: 2rem;">
            <i class="fas fa-hard-hat" style="font-size: 5rem; color: #1B4332; margin-bottom: 1.5rem; display: inline-block;"></i>
            <i class="fas fa-cog" style="font-size: 2rem; color: #40916C; position: absolute; top: 20px; right: 20px; animation: gearSpin 4s linear infinite;"></i>
            <i class="fas fa-cog" style="font-size: 1.5rem; color: #2D6A4F; position: absolute; bottom: 20px; left: 20px; animation: gearSpin 3s linear infinite reverse;"></i>
        </div>
        <h1 style="color: #1B4332; font-size: 2.5rem; margin-bottom: 1rem;">Under Construction</h1>
        <p style="font-size: 1.2rem; color: #2D6A4F; margin-bottom: 2rem;">We're working hard to bring you something amazing. Please check back soon!</p>
        
        <!-- Progress Bar -->
        <div style="width: 100%; height: 4px; background: #E9ECEF; border-radius: 2px; margin-bottom: 2rem; overflow: hidden;">
            <div style="width: 0; height: 100%; background: linear-gradient(90deg, #40916C, #2D6A4F); animation: progressBar 2s ease-in-out infinite;"></div>
        </div>

        <div style="display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap;">
            <a href="mailto:contact@bridgeline.com" style="display: inline-flex; align-items: center; gap: 0.5rem; padding: 0.8rem 1.5rem; background: #40916C; color: white; text-decoration: none; border-radius: 5px; font-weight: 600; transition: all 0.3s ease; border: 2px solid transparent;">
                <i class="fas fa-envelope"></i>
                Contact Us
            </a>
            <a href="https://wa.me/yourphonenumber" style="display: inline-flex; align-items: center; gap: 0.5rem; padding: 0.8rem 1.5rem; background: #25D366; color: white; text-decoration: none; border-radius: 5px; font-weight: 600; transition: all 0.3s ease; border: 2px solid transparent;">
                <i class="fab fa-whatsapp"></i>
                WhatsApp
            </a>
        </div>
    </div>
    <footer style="margin-top: 2rem; text-align: center; color: #081C15; font-size: 0.9rem;">
        <p>&copy; 2024 Bridgeline. All rights reserved.</p>
    </footer>

    <script>
        // Button hover effects
        document.querySelectorAll('a').forEach(button => {
            button.addEventListener('mouseover', () => {
                button.style.backgroundColor = 'transparent';
                button.style.borderColor = button.style.backgroundColor;
                button.style.color = button.style.backgroundColor;
            });
            
            button.addEventListener('mouseout', () => {
                button.style.backgroundColor = '';
                button.style.borderColor = 'transparent';
                button.style.color = 'white';
            });
        });
    </script>
</body>
</html>
